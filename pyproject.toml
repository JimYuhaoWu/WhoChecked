[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whochecked"
version = "0.0.1"
description = "Who evaluated a research resource, and were they independent of its authors"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

# Only the citation walk touches the network. CFCR imports whochecked.overlap
# and promises `pip install cfcr` needs no network library, so `requests` goes
# in an extra:
#     pip install -e ".[walk]"
[project.optional-dependencies]
walk = ["requests"]
# The web server, M3. It walks, so it needs the walk's dependency too:
#     pip install -e ".[server]"
server = ["requests", "flask>=3.1", "waitress>=3.0"]

[tool.setuptools]
packages = ["whochecked", "whochecked.templates", "whochecked.static"]

[tool.setuptools.package-data]
"whochecked" = ["sample.json"]
"whochecked.templates" = ["*.html"]
"whochecked.static" = ["*.css", "fonts/*"]
