[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whochecked"
version = "0.0.1"
description = "Who evaluated a research resource, and were they independent of its authors"
requires-python = ">=3.10"
dependencies = []

# Only the citation walk touches the network. CFCR imports whochecked.overlap
# and promises `pip install cfcr` needs no network library, so `requests` goes
# in an extra:
#     pip install -e ".[walk]"
[project.optional-dependencies]
walk = ["requests"]

[tool.setuptools]
packages = ["whochecked"]
